name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Installs the analysis stack + dev tools only. The heavy CUDA ML stack
      # (the `ml` extra: neuralgcm, jax[cuda12], dinosaur, ...) is NOT installed;
      # eval_common imports it lazily, so the package + tests import without it.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format check)
        run: ruff format --check .

      # NOTE: import-linter (`lint-imports`, contracts in .importlinter) builds the
      # full import graph, which pulls in the GraphCast/JAX inference modules -- so it
      # runs where the `ml` extra is installed (locally / on the cluster), not in this
      # light CI job. See docs/development.md.

      - name: Mypy (typed core)
        run: mypy

      - name: Pytest
        run: pytest
